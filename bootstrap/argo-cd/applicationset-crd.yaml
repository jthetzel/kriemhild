apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationset-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/jthetzel/kriemhild.git
    path: bootstrap/applicationset-crd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # The ApplicationSet CRD is too large for client-side apply.
      - ServerSideApply=true
